services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  washzone:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=WashZone;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      ASPNETCORE_URLS: "http://+:8080"
    ports:
      - "8080:8080"
    volumes:
      - washzone-keys:/app/keys
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: always

volumes:
  sqlserver-data:
  washzone-keys:
